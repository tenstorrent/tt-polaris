#
# Blackhole™ architecture spec (parallel to config/tt_wh.yaml).
# Product details: https://docs.tenstorrent.com/aibs/blackhole/specifications.html
#
# Part numbers: p100a TC-03008, p150a TC-03003, p150b TC-03002
# | Card  | Tensix | AI clock (max) | GDDR6 | Speed   | BW      |
# | p100a | 120    | 1.35 GHz       | 28 GB | 16 GT/s | 448 GB/s|
# | p150a | 120    | 1.35 GHz       | 32 GB | 16 GT/s | 512 GB/s|
# | p150b | 120    | 1.35 GHz       | 32 GB | 16 GT/s | 512 GB/s|
#
# tensix instruction TPT tables below are copied from tt_wh.yaml as a placeholder
# until Blackhole-calibrated throughput data exists in-repo.
ipblocks:
    -   name: tensix
        iptype: compute
        l2_cache:
            num_banks: 32
            bytes_per_clk_per_bank: 64
        pipes:
        -   name: matrix
            num_units   : 1
            freq_MHz    : 1000
            instructions:
            -   {name: add, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: sub, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: mul, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: mac, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
        -   name: vector
            num_units   : 1
            freq_MHz    : 1000
            instructions:
            -   {name: add,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sub,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mul,   tpt: { int32: 32., fp32: 32. }}
            -   {name: div,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mac,   tpt: { int32: 32., fp32: 32. }}
            -   {name: tanh,  tpt: { int32: 32., fp32: 32. }}
            -   {name: log,   tpt: { int32: 32., fp32: 32. }}
            -   {name: exp,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sqrt, tpt: { int32: 32., fp32: 32. }}
            -   {name: rsqrt, tpt: { int32: 32., fp32: 32. }}
            -   {name: reciprocal, tpt: { int32: 32., fp32: 32. }}
            -   {name: cmp,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mov,   tpt: { int32: 32., fp32: 32. }}
            -   {name: max,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sin, tpt: { int32: 32., fp32: 32. }}
            -   {name: cos, tpt: { int32: 32., fp32: 32. }}

    -   name: gddr6_bh
        iptype: memory
        technology: GDDR
        data_bits : 32
        data_rate : 8
        freq_MHz  : 1000
        size_GB   : 4
        transfer_rate_GTs : 16.0

# llama3 per-workload arch config: p100a points at the llama3-specific full-arity LUT
# (bh_p100a_llama3_lut_v8). VGG/ViT keep the shared bh_p100a_lut_v5 via config/tt_bh.yaml.
packages:
    -   name: Blackhole
        instances:
        -   name: p100a
            operator_lookup_file: __ext/hlm-lut/bh_p100a_llama3_lut_v9-1.yaml
            # Worker (Tensix) core grid as (columns, rows) -- see doc/TTNN_SHIM_ARCHITECTURE.md §17: 11 x 10 = 110
            # cores on p100a, i.e. what tt-metal's device.compute_with_storage_grid_size() reports.
            # Source: tt-metal/tt_metal/core_descriptors/blackhole_140_arch.yaml, compute_with_storage_grid_range per
            # harvest tier: unharvested end=[12, 9] -> 13x10; 2xharvested end=[10, 9] -> 11x10 = 110, which is p100a.
            # All 749 p100a llama3 decode capture rows report AVAILABLE WORKER CORE COUNT = 110.
            #
            # How it is accessed:
            #   - Compute throughput: SimConfig.compute_units() (ttsim/config/simconfig.py) returns x * y of
            #     this field. SimConfig.peak_ipc() and peak_flops() multiply the per-core pipe throughput by it,
            #     and Device.execute_op (ttsim/back/device.py) turns peak_ipc into compute_cycles, so analytical
            #     compute time is for 110 cores.
            #   - Conv channel padding: Device._annotate_conv_x_pad_logical (ttsim/back/device.py) reads this grid
            #     to derive the BLOCK_SHARDED channel padding used in LUT keys.
            # An instance that omits this field falls back to the compute ipgroup's num_units
            # (SimConfig.compute_units()).
            #
            # num_units below (120) is not used for compute throughput (compute_grid_size takes precedence). It is the
            # fallback for the lookup's core_count (tools/perf_lookup/lookup_operator_perf.py:1473,
            # resolve_operator_lookup_core_count); bh_p100a_llama3_lut_v8.yaml embeds no curve data (35 single, 6 hybrid
            # entries) and operator_lookup_hybrid_curve is unset, so a LUT hit yields the table's own msecs. With the
            # LUT on, the old (12x10) and new (11x10) grids give identical ops, LUT hits and total msecs for llama3 decode.
            compute_grid_size: [11, 10]
            ipgroups:
            -   ipname: tensix
                iptype: compute
                # num_units is not used for compute throughput here: compute_grid_size above takes
                # precedence in SimConfig.compute_units(). It is still read by
                #   - resolve_operator_lookup_core_count (tools/perf_lookup/lookup_operator_perf.py): the
                #     LUT core count when operator_lookup_core_count is unset;
                #   - the config dump in Device (ttsim/back/device.py).
                num_units   : 120
                ramp_penalty: 100
                ip_overrides:
                    pipes.matrix.freq_MHz: 1350
                    pipes.vector.freq_MHz: 1350
            -   ipname: gddr6_bh
                iptype: memory
                num_units: 7
        -   name: p150a
            ipgroups:
            -   ipname: tensix
                iptype: compute
                # No compute_grid_size on this instance: SimConfig.compute_units() uses this num_units for
                # compute throughput (peak_ipc / peak_flops), and the operator-lookup core count falls
                # back to it (tools/perf_lookup/lookup_operator_perf.py).
                num_units   : 120
                ramp_penalty: 100
                ip_overrides:
                    pipes.matrix.freq_MHz: 1350
                    pipes.vector.freq_MHz: 1350
            -   ipname: gddr6_bh
                iptype: memory
                num_units: 8
        -   name: p150b
            ipgroups:
            -   ipname: tensix
                iptype: compute
                # No compute_grid_size on this instance: SimConfig.compute_units() uses this num_units for
                # compute throughput (peak_ipc / peak_flops), and the operator-lookup core count falls
                # back to it (tools/perf_lookup/lookup_operator_perf.py).
                num_units   : 120
                ramp_penalty: 100
                ip_overrides:
                    pipes.matrix.freq_MHz: 1350
                    pipes.vector.freq_MHz: 1350
            -   ipname: gddr6_bh
                iptype: memory
                num_units: 8
