ipblocks:
    -   name: tensix
        iptype: compute
        l2_cache:
            num_banks: 32
            bytes_per_clk_per_bank: 64
        pipes:
        -   name: matrix
            num_units   : 1
            freq_MHz    : 1000
            instructions:
            -   {name: add, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: sub, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: mul, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: mac, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
        -   name: vector
            num_units   : 1
            freq_MHz    : 1000
            instructions:
            -   {name: add,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sub,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mul,   tpt: { int32: 32., fp32: 32. }}
            -   {name: div,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mac,   tpt: { int32: 32., fp32: 32. }}
            -   {name: tanh,  tpt: { int32: 32., fp32: 32. }}
            -   {name: log,   tpt: { int32: 32., fp32: 32. }}
            -   {name: exp,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sqrt, tpt: { int32: 32., fp32: 32. }}
            -   {name: rsqrt, tpt: { int32: 32., fp32: 32. }}
            -   {name: reciprocal, tpt: { int32: 32., fp32: 32. }}
            -   {name: cmp,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mov,   tpt: { int32: 32., fp32: 32. }}
            -   {name: max,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sin, tpt: { int32: 32., fp32: 32. }}
            -   {name: cos, tpt: { int32: 32., fp32: 32. }}

    -   name: gddr6
        iptype: memory
        technology: GDDR
        data_bits : 32
        data_rate : 8
        freq_MHz  : 750
        size_GB   : 2
        transfer_rate_GTs : 12.0

packages:
    -   name: Wormhole
        instances:
        -   name: n150
            # operator_lookup_file can be a local path or LFC path starting with lfc://
            operator_lookup_file: __ext/hlm-lut/whb0_n150_lut_v6.yaml
            # Worker (Tensix) core grid as (columns, rows): 8 x 8 = 64 cores on n150, i.e. what tt-metal's
            # device.compute_with_storage_grid_size() reports.
            #
            # Source: tt-metal/tt_metal/core_descriptors/wormhole_b0_80_arch_eth_dispatch.yaml, field
            # compute_with_storage_grid_range, which keys the grid PER PRODUCT:
            #
            #   galaxy      end=[7, 9]  ->  8x10  =  80
            #   nebula_x1   end=[7, 7]  ->  8x8   =  64   <- n150 (single ASIC)
            #   nebula_x2   end=[7, 7]  ->  8x8   =  64   <- n300, per ASIC
            #
            # n150 is nebula_x1, so this field is 8x8 = 64. (It was 8x9 = 72, the card's Tensix count from the spec
            # table at the foot of this file -- a different quantity, reached by subtracting one harvested row from
            # the 8x10 die rather than by reading the product key.)
            #
            # Capture agreement: every row of the n150 refruns (resnet50 108, vit 206, vgg_unet 105 = 419 ops; e.g.
            # __refrun_cache/resnet50/wh/n150/merged_ops_resnet50-02b76a9-wormhole_b0-n150_L-260916.csv) reports
            # AVAILABLE WORKER CORE COUNT = 64, and no op dispatches on more.
            #
            # How it is accessed:
            #   - Compute throughput: SimConfig.compute_units() (ttsim/config/simconfig.py) returns x * y of
            #     this field. SimConfig.peak_ipc() and peak_flops() multiply the per-core pipe throughput by it,
            #     and Device.execute_op (ttsim/back/device.py) turns peak_ipc into compute_cycles, so analytical
            #     compute time is for 64 cores.
            #   - Conv channel padding: Device._annotate_conv_x_pad_logical (ttsim/back/device.py) reads this grid
            #     to derive the BLOCK_SHARDED channel padding used in LUT keys.
            # An instance that omits this field falls back to the compute ipgroup's num_units
            # (SimConfig.compute_units()).
            #
            # Measured with the LUT on at 8x9 and 8x8 across resnet50, vgg_unet and vit: identical op counts,
            # per-optype census, LUT hits and total msecs. Three things keep LUT keys independent of the grid:
            #   1. _HALO_EXT_Y_OVERRIDES_BY_DEVICE is TRANSCRIBED from the capture, so the largest
            #      grid consumer never reads this;
            #   2. everywhere else the grid only feeds values that are compared against each other,
            #      so a uniformly-wrong grid cancels;
            #   3. the channel-axis start divisor of find_closest_largest_divisor_with_num_padding is grid x = 8 at both,
            #      and padded channels are identical for every channel count 32..2048 (the 9 vs 8 rows only change the
            #      NHW divisor, which is not used for channel padding).
            #
            # Mask (1) LIFTS if anyone ports the halo derivation
            # (tt-metal/ttnn/cpp/ttnn/operations/sliding_window/sliding_window.cpp:
            # generate_shard_boundaries -> generate_max_out_nsticks_per_core), which reads
            # config.num_cores_nhw directly: the derived table would then depend on this grid.
            #
            # num_units below (72) is not used for compute throughput (compute_grid_size takes precedence). It is
            # the fallback for the lookup's core_count (tools/perf_lookup/lookup_operator_perf.py:1473,
            # resolve_operator_lookup_core_count -- no config sets operator_lookup_core_count), and core_count
            # reaches only two places: _eval_curve_value (:318), which evaluates a regression AT core_count and is
            # not reached because whb0_n150_lut_v6.yaml embeds no curve data (143 single, 22 hybrid
            # entries) and operator_lookup_hybrid_curve is unset; and _maybe_warn_single_core_mismatch (:384), which
            # logs at debug level and returns, "using table scalars as-is". A LUT hit therefore yields the table's
            # own msecs whatever num_units says (total LUT msecs is identical at the old and new grid).
            compute_grid_size: [8, 8]
            ipgroups:
            -   ipname: tensix
                iptype: compute
                # num_units is not used for compute throughput here: compute_grid_size above takes
                # precedence in SimConfig.compute_units(). It is still read by
                #   - resolve_operator_lookup_core_count (tools/perf_lookup/lookup_operator_perf.py): the
                #     LUT core count when operator_lookup_core_count is unset;
                #   - the config dump in Device (ttsim/back/device.py).
                num_units   : 72
                ramp_penalty: 50
                ip_overrides:
                    pipes.matrix.freq_MHz: 1000
                    pipes.vector.freq_MHz: 1000
            -   ipname: gddr6
                iptype: memory
                num_units: 6
        -   name: n300
            ipgroups:
            -   ipname: tensix
                iptype: compute
                # No compute_grid_size on this instance: SimConfig.compute_units() uses this num_units for
                # compute throughput (peak_ipc / peak_flops), and the operator-lookup core count falls
                # back to it (tools/perf_lookup/lookup_operator_perf.py).
                num_units   : 128
                ramp_penalty: 100
                ip_overrides:
                    pipes.matrix.freq_MHz: 1000
                    pipes.vector.freq_MHz: 1000
            -   ipname: gddr6
                iptype: memory
                num_units: 12

#from https://tenstorrent.com/hardware/wormhole
# Specification,     n150s,     n150d,    n300s,    n300d
# Part Number,       TC-02001,  TC-02002, TC-02003, TC-02004
# Wormholes,         1,         1,        2,        2
# AI Clock (GHz),    1.0,       1.0,      1.0,      1.0
# Tensix Cores,      72,        72,       128,      128
# SRAM/Tensix(MB),   1.5,       1.5,      1.5,      1.5
# SRAM(MB),          108,       108,      192,      192
# MemTech,           GDDR6,     GDDR6,    GDDR6,    GDDR6
# MemSize(GB),       12,        12,       24,       24
# MemSpeed(GT/s),    12,        12,       12,       12
# MemBW(GB/s),       288,       288,      576,      576
# TFLOPS (FP8),      262,       262,      466,      466 -- this works for freq = 885 MHz
# TFLOPS (FP16),     74,        74,       131,      131 -- this works for freq = 1000 MHz
# TFLOPS (BLOCKFP8), 148,       148,      262,      262 -- this works for freq = 1000 MHz
# TBP(W),            160,       160,      300,      300
# C2C(G),            N/A,       N/A,      200,      200
# Dims,              DimB,      DimA,     DimB,     DimA
# Dimsp,             DimB+,     N/A,      DimB+,    N/A
# Cooling,           Passive,   Fan,      Passive,  Fan

# Glossary
#     Fan         : Active (Axial Fan)
#     DimA (WxDxH): 52.2mm x 256.0mm x 111.0mm'
#     DimB (WxDxH): 36.0mm x 254.0mm x 111.0mm'
#     DimB+(WxDxH): 36.0mm x 393.5mm x 114.0mm' (with cooling kit)
#     C2C         : Internal Chip to Chip
#     TBP         : Total Board Power

# Common Specs
#     Connectivity                : 2x Warp 100 Bridge; 2x QSFP-DD 200G (Active)*
#     External Power              : 1x 4+4-pin EPS12V
#     System Interface PCI Express: 4.0x16 PCI Express
