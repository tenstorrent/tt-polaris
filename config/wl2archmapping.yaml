op_data_type_spec:
  global_type: int8
  override:
    dropout: int32

op_removal_spec:
  - Dropout
  - Identity
  - Constant

op_fusion_spec:
  - [Add, LayerNormalization, Matmul, Add, Matmul, Add, Gelu]
  - [Add, LayerNormalization, Matmul, Add, Split]
  - [Add, LayerNormalization, Matmul]
  - [Add, LayerNormalization]
  - [Reshape, Transpose, Transpose]
  - [Reshape, Transpose]
  - [Transpose, Transpose]
  - [Matmul, Add, Matmul, Add, Gelu]
  - [Matmul, Matmul]
  - [Matmul, Mul, Softmax]
  - [Matmul, Mul]
  - [Matmul, Add, Split]
  - [Matmul, Add, Gelu]
  - [Matmul, Add]
  - [Matmul, Gelu, Add]
  - [Matmul, Transpose, Reshape]
  - [Conv, Relu]
  - [Conv, BatchNormalization, Add, Relu, AveragePool, Reshape]
  - [Conv, BatchNormalization, Add, Relu]
  - [Conv, BatchNormalization, Relu, MaxPool]
  - [Conv, BatchNormalization, Relu]
  - [Conv, BatchNormalization, LeakyRelu]
  - [Conv, BatchNormalization, Sigmoid, Mul]
  - [Conv, BatchNormalization, Mul]
  - [Conv, BatchNormalization]
  - [Conv, GroupNormalization, Relu]
  - [Conv, GroupNormalization]

op_rsrc_spec:
  compute:
    matrix: [Matmul, Conv, ConvTranspose, Einsum, Gemm, MultiheadAttention, ScaledDotProductAttention]
    vector: [Abs, Add, And, ArgMax, AveragePool,
             BatchNormalization,
             Cast, Clip, Concat, Constant, ConstantOfShape, Cos, CumSum,
             DequantizeLinear, Div, Dropout,
             Equal, Erf, Exp, Expand,
             Flatten, Fold,
             Embedding,
             Gather, GatherElements, GatherND, Gelu, GlobalAveragePool, GridSample, Greater, GreaterOrEqual, GroupNormalization,
             Halo,
             HardSigmoid, Hardswish,
             Identity, If, InterleavedToSharded, IsNaN,
             Move,
             LayerNormalization, LeakyRelu, LessOrEqual, Log, Less,
             Max, MaxPool, Mean, Min, Mish, Mod, Mul,
             Neg, Not, ConcatHeads, CreateQKVHeads, NLPCreateQKVHeadsDecode, NLPConcatHeadsDecode, # transformer head ops (prefill+decode) from ttnn_shim
             RotaryEmbeddingLlama, RotaryEmbeddingLlamaFusedQK, PagedFillCache, PagedFusedUpdateCache, NonMaxSuppression, NonZero, # transformer rope/cache ops from ttnn_shim
             PlusOne, ManualSeed, Sampling, # decode sampling-tail ops from ttnn_shim
             Pad, Permute, Pow,
             QuantizeLinear,
             Range, Reciprocal, ReduceMax, ReduceMean, ReduceMin, ReduceProd, ReduceSum, Relu, Reshard, Reshape, Resize,
             ScatterND, ScatterElements, Shape, ShardedToInterleaved, Sigmoid, Sin, SkipLayerNormalization, Slice, Softmax, SoftmaxCrossEntropyLoss, Softplus, Split, Sqrt, Squeeze, Sub, Sum,
             Tanh, Tile, Tilize, TilizeWithValPadding, TopK, TorchGather, Transpose, Trilu, Typecast,
             Unsqueeze, Untilize, UntilizeWithUnpadding, Upsample,
             VoxelPooling,
             Where]

# Arch-aware column split (issue #477): the llama3 lm_head is emitted as ONE canonical
# GEMM (dim x vocab) in the device-independent front end; the backend expands it into the
# arch's L1-sized vocab column tiles + Concat (BH: 8 x 16032; WH: 3 x 42752), matching the
# HW capture. Only the lm_head produces a vocab(128256)-wide matmul, so match on output_x.
op_split_spec:
  - op_type: MatMul
    match_output_x: 128256   # llama3 vocab_size
    kind: lm_head_vocab
