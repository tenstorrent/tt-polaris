#
# Blackhole™ architecture spec (parallel to config/tt_wh.yaml).
# Product details: https://docs.tenstorrent.com/aibs/blackhole/specifications.html
#
# Part numbers: p100a TC-03008, p150a TC-03003, p150b TC-03002
# | Card  | Tensix | AI clock (max) | GDDR6 | Speed   | BW      |
# | p100a | 120    | 1.35 GHz       | 28 GB | 16 GT/s | 448 GB/s|
# | p150a | 120    | 1.35 GHz       | 32 GB | 16 GT/s | 512 GB/s|
# | p150b | 120    | 1.35 GHz       | 32 GB | 16 GT/s | 512 GB/s|
#
# tensix instruction TPT tables below are copied from tt_wh.yaml as a placeholder
# until Blackhole-calibrated throughput data exists in-repo.
ipblocks:
    -   name: tensix
        iptype: compute
        l2_cache:
            num_banks: 32
            bytes_per_clk_per_bank: 64
        pipes:
        -   name: matrix
            num_units   : 1
            freq_MHz    : 1000
            instructions:
            -   {name: add, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: sub, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: mul, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: mac, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
        -   name: vector
            num_units   : 1
            freq_MHz    : 1000
            instructions:
            -   {name: add,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sub,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mul,   tpt: { int32: 32., fp32: 32. }}
            -   {name: div,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mac,   tpt: { int32: 32., fp32: 32. }}
            -   {name: tanh,  tpt: { int32: 32., fp32: 32. }}
            -   {name: log,   tpt: { int32: 32., fp32: 32. }}
            -   {name: exp,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sqrt, tpt: { int32: 32., fp32: 32. }}
            -   {name: rsqrt, tpt: { int32: 32., fp32: 32. }}
            -   {name: reciprocal, tpt: { int32: 32., fp32: 32. }}
            -   {name: cmp,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mov,   tpt: { int32: 32., fp32: 32. }}
            -   {name: max,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sin, tpt: { int32: 32., fp32: 32. }}
            -   {name: cos, tpt: { int32: 32., fp32: 32. }}

    -   name: gddr6_bh
        iptype: memory
        technology: GDDR
        data_bits : 32
        data_rate : 8
        freq_MHz  : 1000
        size_GB   : 4
        transfer_rate_GTs : 16.0

packages:
    -   name: Blackhole
        instances:
        -   name: p100a
            # operator_lookup_file can be a local path or LFC path starting with lfc://
            operator_lookup_file: lfc://hlm-lut/bh_p100a_lut_v6.yaml
            # Worker (Tensix) core grid as (columns, rows): 11 x 10 = 110 cores on p100a, i.e. what tt-metal's
            # device.compute_with_storage_grid_size() reports.
            #
            # Source: tt-metal/tt_metal/core_descriptors/blackhole_140_arch.yaml, field
            # compute_with_storage_grid_range, which keys the grid PER HARVEST TIER:
            #
            #   unharvested   end=[12, 9]  ->  13x10  =  130
            #   1xharvested   end=[11, 9]  ->  12x10  =  120
            #   2xharvested   end=[10, 9]  ->  11x10  =  110   <- p100a
            #
            # p100a is 2xharvested, so this field is 11x10 = 110. (It was 12x10 = 120, the 1xharvested tier, which
            # equals the card's Tensix count in the table above -- a different quantity.)
            #
            # Capture agreement: every row of the p100a refruns for the workloads that use this file (resnet50 115,
            # vit 195, vgg_unet 107 = 417 ops; e.g. __refrun_cache/resnet50/bh/p100a/merged_ops_resnet50-02b76a9-
            # blackhole-p100a-260816.csv) reports AVAILABLE WORKER CORE COUNT = 110, and no op dispatches on more.
            # llama3 decode runs with config/tt_bh_llama3.yaml, which records its own capture check.
            #
            # How it is accessed:
            #   - Compute throughput: SimConfig.compute_units() (ttsim/config/simconfig.py) returns x * y of
            #     this field. SimConfig.peak_ipc() and peak_flops() multiply the per-core pipe throughput by it,
            #     and Device.execute_op (ttsim/back/device.py) turns peak_ipc into compute_cycles, so analytical
            #     compute time is for 110 cores.
            #   - Conv channel padding: Device._annotate_conv_x_pad_logical (ttsim/back/device.py) reads this grid
            #     to derive the BLOCK_SHARDED channel padding used in LUT keys.
            # An instance that omits this field falls back to the compute ipgroup's num_units
            # (SimConfig.compute_units()).
            #
            # Measured with the LUT on at 12x10 and 11x10 across resnet50, vgg_unet and vit: identical op counts,
            # per-optype census, LUT hits and total msecs. Three things keep LUT keys independent of the grid:
            #   1. _HALO_EXT_Y_OVERRIDES_BY_DEVICE is TRANSCRIBED from the capture, so the largest
            #      grid consumer never reads this;
            #   2. everywhere else the grid only feeds values that are compared against each other,
            #      so a uniformly-wrong grid cancels;
            #   3. find_closest_largest_divisor_with_num_padding walks down to the same divisor from either start for
            #      every BLOCK_SHARDED conv config in these captures (not in general: input channels 1440..1536 pad
            #      differently at 12x10 and 11x10).
            #
            # Mask (1) LIFTS if anyone ports the halo derivation
            # (tt-metal/ttnn/cpp/ttnn/operations/sliding_window/sliding_window.cpp:
            # generate_shard_boundaries -> generate_max_out_nsticks_per_core), which reads
            # config.num_cores_nhw directly: the derived table would then depend on this grid.
            #
            # num_units below (120) is not used on this instance: compute_grid_size takes precedence in
            # SimConfig.compute_units(), which sets compute throughput and is also the lookup's core_count
            # when operator_lookup_core_count is unset (tools/perf_lookup/lookup_operator_perf.py,
            # resolve_operator_lookup_core_count). core_count is only used to evaluate a LUT row's curve at the
            # device's core count; bh_p100a_lut_v6.yaml embeds no curve data (150 single, 23 hybrid entries) and
            # operator_lookup_hybrid_curve is unset, so a LUT hit yields the table's own msecs.
            compute_grid_size: [11, 10]
            ipgroups:
            -   ipname: tensix
                iptype: compute
                # num_units is not used on this instance: compute_grid_size above takes precedence in
                # SimConfig.compute_units(), which sets both compute throughput and the LUT core count
                # (resolve_operator_lookup_core_count). The Device config dump prints both num_units and the
                # effective compute_units.
                num_units   : 120
                ramp_penalty: 100
                ip_overrides:
                    pipes.matrix.freq_MHz: 1350
                    pipes.vector.freq_MHz: 1350
            -   ipname: gddr6_bh
                iptype: memory
                num_units: 7
        -   name: p150a
            ipgroups:
            -   ipname: tensix
                iptype: compute
                # No compute_grid_size on this instance: SimConfig.compute_units() uses this num_units for
                # compute throughput (peak_ipc / peak_flops), and the operator-lookup core count falls
                # back to it (tools/perf_lookup/lookup_operator_perf.py).
                num_units   : 120
                ramp_penalty: 100
                ip_overrides:
                    pipes.matrix.freq_MHz: 1350
                    pipes.vector.freq_MHz: 1350
            -   ipname: gddr6_bh
                iptype: memory
                num_units: 8
        -   name: p150b
            ipgroups:
            -   ipname: tensix
                iptype: compute
                # No compute_grid_size on this instance: SimConfig.compute_units() uses this num_units for
                # compute throughput (peak_ipc / peak_flops), and the operator-lookup core count falls
                # back to it (tools/perf_lookup/lookup_operator_perf.py).
                num_units   : 120
                ramp_penalty: 100
                ip_overrides:
                    pipes.matrix.freq_MHz: 1350
                    pipes.vector.freq_MHz: 1350
            -   ipname: gddr6_bh
                iptype: memory
                num_units: 8
