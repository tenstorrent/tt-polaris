name: 'Download required files from LFC'
description: 'Download required files from LFC'
inputs:
  files:  # id of input
    description: 'Files to download, space separated list'
    required: false
    default: 'ext_test_onnx_models.tar.gz ext_llk_elf_files.tar.gz ext_rtl_test_data_set_sep23.tar.gz'
  lfc-server-urls:
    description: 'Comma-separated list of LFC base URLs. Calling workflow must pass secrets.LFC_SERVER_URLS.'
    required: true
runs:
  using: "composite"
  steps:
    # Server URLs are configuration, not output. This step registers a log mask
    # for each URL entry and its host. tools/ci/lfc_downloader.sh does not print
    # them either. Never echo these values directly.
    - name: Mask LFC server URLs
      shell: bash
      env:
        LFC_SERVER_URLS: ${{ inputs.lfc-server-urls }}
      run: |
        IFS=',' read -r -a entries <<< "$LFC_SERVER_URLS"
        for entry in "${entries[@]}"; do
          url="${entry#"${entry%%[![:space:]]*}"}"
          url="${url%"${url##*[![:space:]]}"}"
          hostport="${url#*://}"
          hostport="${hostport%%[/?#]*}"  # the authority ends at /, ? or #
          hostport="${hostport##*@}"  # drop any user-info
          if [[ "$hostport" == \[* ]]; then
            host="${hostport#\[}"  # IPv6 literal: the address inside [...]
            host="${host%%]*}"
          else
            host="${hostport%%:*}"
          fi
          # Lowercase copies too: masking is case-sensitive, and wget prints
          # host names in lowercase.
          lower_hostport="$(printf '%s' "$hostport" | tr '[:upper:]' '[:lower:]')"
          lower_host="$(printf '%s' "$host" | tr '[:upper:]' '[:lower:]')"
          for value in "$url" "${url%/}" "$hostport" "$host" "$lower_hostport" "$lower_host"; do
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
            fi
          done
        done

    - name: Download files from LFC
      shell: bash
      env:
        LFC_SERVER_URLS: ${{ inputs.lfc-server-urls }}
      run: |
         for file in ${{ inputs.files }}; do
            bash tools/ci/lfc_downloader.sh --extract $file
         done
